name: Backend — Tests & Coverage

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]

jobs:
  test:
    name: Unit Tests + JaCoCo Coverage
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Criar .env para testes
        run: |
          cat > .env << 'EOF'
          SERVER_PORT=8080
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=testdb
          DB_USER=postgres
          DB_PASSWORD=postgres
          JWT_SECRET=test_secret_key_that_is_at_least_256_bits_long_for_testing
          JWT_EXPIRATION=86400000
          REDIS_HOST=localhost
          REDIS_PORT=6379
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          BASE_URL=http://localhost:8080
          UPLOAD_DIR=uploads
          EOF

      - name: Executar testes e gerar relatório de cobertura
        run: mvn verify --batch-mode -Dmaven.test.failure.ignore=false

      - name: Gerar relatório HTML do Surefire
        if: always()
        run: mvn surefire-report:report-only --batch-mode -DskipTests

      - name: Publicar resumo dos testes no GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados dos Testes
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload — Relatório JaCoCo (cobertura)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload — Relatório Surefire (execução)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-report
          path: target/site/surefire-report.html
          retention-days: 30

      - name: Resumo de cobertura no PR
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE_FILE="target/site/jacoco/index.html"
          if [ -f "$COVERAGE_FILE" ]; then
            MISSED=$(grep -o 'Total[^%]*%' "$COVERAGE_FILE" | head -1 || echo "N/A")
            echo "## Cobertura de Codigo" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Relatorio completo disponivel nos artefatos do workflow." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Baixe **jacoco-coverage-report** para ver cobertura linha a linha" >> $GITHUB_STEP_SUMMARY
            echo "- Baixe **surefire-test-report** para ver resultado de cada teste" >> $GITHUB_STEP_SUMMARY
          fi
