spring:
  application:
    name: backend-service

  # ── Banco de dados ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ───────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── Kafka Cluster (3 brokers, 3 partições, RF=3) ────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093,localhost:29094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                    # aguarda confirmação de todos os ISRs
      retries: 3
      properties:
        enable.idempotence: true   # garante exactly-once por partição
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: backend-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ── Virtual Threads (Java 21) ───────────────────────
  threads:
    virtual:
      enabled: true

  # ── Multipart (upload de imagens) ───────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

# ── JWT ─────────────────────────────────────────────
# ── CORS ─────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  base-url: ${BASE_URL:http://localhost:8080}

# ── Upload de arquivos ────────────────────────────────
file:
  upload-dir: ${UPLOAD_DIR:uploads}

# ── Swagger / SpringDoc ───────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── Actuator ─────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
